package:
  name: elmish-testing-library
  publish:
    version: 0.4.0
    license: MIT
    location:
      githubOwner: collegevine
      githubRepo: purescript-elmish-testing-library
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - datetime: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - elmish: ">=0.15.0 <0.16.0"
    - elmish-html: ">=0.13.0 <0.14.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - web-dom: ">=6.0.0 <7.0.0"
    - web-html: ">=4.1.1 <5.0.0"
  test:
    main: Test.Main
    dependencies:
      - spec
      - spec-node
workspace:
  extraPackages:
    elmish:
      git: https://github.com/collegevine/purescript-elmish.git
      ref: v0.15.0
    elmish-html:
      git: https://github.com/collegevine/purescript-elmish-html.git
      ref: v0.13.0
  packageSet:
    registry: 73.1.0
